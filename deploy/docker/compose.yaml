services:
  firewall-ui:
    image: firewall-ui:stable
    pull_policy: never
    restart: unless-stopped
    network_mode: host
    pid: host
    # Host firewall and ICMP sysctls require access to the host kernel.
    privileged: true
    environment:
      FIREWALL_UI_USERNAME: ${FIREWALL_UI_USERNAME:-admin}
      FIREWALL_UI_PASSWORD: ${FIREWALL_UI_PASSWORD:?Set FIREWALL_UI_PASSWORD in .env}
    volumes:
      - firewall-ui-config:/etc/firewall-ui
      - firewall-ui-data:/var/lib/firewall-ui
      - type: bind
        source: /etc/ssh
        target: /etc/ssh
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  firewall-ui-config:
  firewall-ui-data:
