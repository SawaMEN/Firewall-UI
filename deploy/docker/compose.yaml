services:
  firewall-ui:
    image: firewall-ui:stable
    pull_policy: never
    restart: unless-stopped
    network_mode: host
    pid: host
    # Host firewall and ICMP sysctls require access to the host kernel.
    privileged: true
    environment:
      FIREWALL_UI_HOST_FIREWALL: "1"
      FIREWALL_UI_HOST_UPDATE_DIR: ${FIREWALL_UI_DOCKER_INSTALL_DIR:-/opt/firewall-ui}
      FIREWALL_UI_USERNAME: ${FIREWALL_UI_USERNAME:-admin}
      FIREWALL_UI_PASSWORD: ${FIREWALL_UI_PASSWORD:?Set FIREWALL_UI_PASSWORD in .env}
    volumes:
      # Identical host paths for native and Docker installations.
      - type: bind
        source: ${FIREWALL_UI_CONFIG_DIR:-/etc/firewall-ui}
        target: /etc/firewall-ui
        bind:
          create_host_path: false
      - type: bind
        source: ${FIREWALL_UI_STATE_DIR:-/var/lib/firewall-ui}
        target: /var/lib/firewall-ui
        bind:
          create_host_path: false
      - type: bind
        source: /etc/ssh
        target: /etc/ssh
        read_only: true
        bind:
          create_host_path: false
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

