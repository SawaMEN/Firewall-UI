# Place inside your HTTPS server block. Both containers must use the proxy network.
location / {
    # Docker DNS re-resolves the service after a container is recreated.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $firewall_backend firewall-ui.internal:8088;
    proxy_pass http://$firewall_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
}
