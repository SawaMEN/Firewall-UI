services:
  firewall-ui:
    build: .
    image: firewall-ui:local
    restart: unless-stopped
    network_mode: host
    pid: host
    # Host firewall and ICMP sysctls require access to the host kernel.
    privileged: true
    environment:
      FIREWALL_UI_USERNAME: ${FIREWALL_UI_USERNAME:-admin}
      FIREWALL_UI_PASSWORD: ${FIREWALL_UI_PASSWORD:?Set FIREWALL_UI_PASSWORD in .env}
    volumes:
      - firewall-ui-config:/etc/firewall-ui
      - firewall-ui-data:/var/lib/firewall-ui
      - /etc/ssh:/etc/ssh:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  firewall-ui-config:
  firewall-ui-data:
