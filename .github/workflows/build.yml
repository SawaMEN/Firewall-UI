name: Build and test
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '**/*.md'
  schedule:
    - cron: '23 3 * * 0'
  workflow_dispatch:
permissions:
  contents: read
# Cancel obsolete pushes in the same branch, including releases: only
# the current main commit can be published, so earlier builds waste runners.
concurrency:
  group: firewall-ui-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    outputs:
      build_time: ${{ steps.metadata.outputs.build_time }}
      distributions: ${{ steps.scope.outputs.distributions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: scope
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          scope=true
          if [[ "$GITHUB_EVENT_NAME" == push ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed="$(git diff --name-only "$BEFORE" HEAD)"
            if [[ -n "$changed" ]] && ! grep -Eqv '^(README\.md|docs/.*)$' <<< "$changed"; then scope=false; fi
          fi
          echo "distributions=$scope" >> "$GITHUB_OUTPUT"
      - id: metadata
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        if: github.event_name != 'pull_request'
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: internal/webassets/dist
          retention-days: 3
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-${{ runner.os }}-tests-${{ hashFiles('go.mod') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-${{ runner.os }}-tests-${{ hashFiles('go.mod') }}-
      - name: Check shell scripts
        run: bash -n install.sh deploy/firewall-ui deploy/firewall-ui-docker deploy/firewall-ui-switch scripts/build-release.sh && bash tests/installer.sh && bash tests/manager.sh && bash tests/access.sh && bash tests/uninstall.sh && bash tests/install-menu.sh && bash tests/connection.sh && bash tests/switch-install.sh && bash tests/shared-paths.sh && bash tests/docker-installer.sh && bash tests/docker-updates.sh && python3 tests/release-manifest.py
      - name: Static analysis of shell scripts
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq shellcheck
          fi
          shellcheck -S error install.sh deploy/firewall-ui deploy/firewall-ui-docker deploy/firewall-ui-switch scripts/build-release.sh tests/*.sh
      - name: Check Go formatting
        run: |
          if [[ -n "$(gofmt -l ./cmd ./internal)" ]]; then
            gofmt -d ./cmd ./internal
            exit 1
          fi
      # PRs get the quick suite; main + weekly/manual builds run race checks.
      - name: Go tests (pull requests)
        if: github.event_name == 'pull_request'
        run: go test -vet=off ./...
      - name: Go tests with race detection (main and extended)
        if: github.event_name != 'pull_request'
        run: go test -race -vet=off ./...
      - name: Go static analysis
        if: github.event_name != 'pull_request'
        run: go vet ./...
  binaries:
    needs: [frontend, checks]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('go.mod') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('go.mod') }}-
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: internal/webassets/dist
      - name: Build release binaries once
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
          BUILD_TIME: ${{ needs.frontend.outputs.build_time }}
        run: |
          set -euo pipefail
          DEV_VERSION="dev-${GITHUB_SHA::7}"
          scripts/build-release.sh "$ARCH" dev "$DEV_VERSION"
          STABLE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" != pull_request ]] && ! gh release view "v$STABLE_VERSION" >/dev/null 2>&1; then
            scripts/build-release.sh "$ARCH" stable "$STABLE_VERSION"
          fi
          printf '%s\n' "$BUILD_TIME" > dist-dev/build-time.txt
          mkdir -p release-assets
          cp -R dist-dev release-assets/
          if [[ -d dist-stable ]]; then cp -R dist-stable release-assets/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: firewall-ui-linux-${{ matrix.arch }}
          path: release-assets
          retention-days: 7

  distributions:
    needs: [binaries, frontend]
    # The installer/systemd matrix is expensive and duplicates the Docker
    # lifecycle smoke tests. Run it weekly or on manual request, not on
    # every release-producing commit.
    if: needs.frontend.outputs.distributions == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        distro: ['archlinux:base', 'debian:13', 'fedora:44', 'opensuse/leap:16.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firewall-ui-linux-amd64
          path: distro-binary
      - name: Install and exercise the native service with systemd and real packages
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          set -euo pipefail
          docker build -f tests/linux-distro.Dockerfile --build-arg "DISTRO=$DISTRO" -t firewall-ui-distro .
          docker run -dt --name firewall-ui-distro --privileged --cgroupns=host --tmpfs /run --tmpfs /run/lock -v /sys/fs/cgroup:/sys/fs/cgroup:rw -v /lib/modules:/lib/modules:ro firewall-ui-distro
          cleanup_distro() {
            local status=$?
            if ((status != 0)); then
              # Preserve full startup and service logs only when the test fails.
              docker inspect firewall-ui-distro --format '{{json .State}}' || true
              docker logs firewall-ui-distro || true
              docker exec firewall-ui-distro journalctl --no-pager -u firewall-ui.service || true
            fi
            docker rm -f firewall-ui-distro >/dev/null || {
              echo 'Could not remove the distro test container' >&2
              return 1
            }
            return "$status"
          }
          trap cleanup_distro EXIT
          for attempt in {1..30}; do
            if docker exec firewall-ui-distro systemctl list-units --no-pager >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec firewall-ui-distro timeout 180 bash /opt/checks/tests/linux-distro.sh verify

  browser:
    needs: [binaries]
    # Browser e2e exercises login, theme, and navigation once per PR,
    # plus weekly/manual checks. It is not rebuilt on every main commit.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: firewall-ui-linux-amd64
          path: browser-binary
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1.56.1
      - name: Verify browser authentication, tabs and themes
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-audit --no-fund --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
          chmod +x browser-binary/dist-dev/firewall-ui-linux-amd64
          sudo -E env FIREWALL_UI_USERNAME=admin FIREWALL_UI_PASSWORD=1 browser-binary/dist-dev/firewall-ui-linux-amd64 -config "$RUNNER_TEMP/browser-config.json" -listen 127.0.0.1:18123 -state "$RUNNER_TEMP/browser-state/state.json" > "$RUNNER_TEMP/browser-server.log" 2>&1 &
          TASK_PANEL_PID=$!
          trap 'sudo kill "$TASK_PANEL_PID" || true' EXIT
          for attempt in {1..20}; do curl -fsS http://127.0.0.1:18123/ >/dev/null && break; sleep 1; done
          PLAYWRIGHT_TOOLS="$RUNNER_TEMP/browser-tools" FIREWALL_UI_SCREENSHOTS="$RUNNER_TEMP/browser-shots" node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-screenshots
          path: ${{ runner.temp }}/browser-shots
          retention-days: 3
