name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts
        run: bash -n install.sh deploy/firewall-ui
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Check Go formatting
        run: |
          files="$(gofmt -l ./cmd ./internal)"
          if [[ -n "$files" ]]; then
            echo "Files requiring gofmt:"
            echo "$files"
            exit 1
          fi
      - run: go test -race ./...
      - run: go vet ./...
      - name: Build Linux binaries
        run: |
          mkdir -p dist
          short_sha="${GITHUB_SHA:0:12}"
          ldflags="-s -w -X github.com/SawaMEN/Firewall-UI/internal/updater.Version=ci-${short_sha} -X github.com/SawaMEN/Firewall-UI/internal/updater.Commit=${GITHUB_SHA} -X github.com/SawaMEN/Firewall-UI/internal/updater.BuildChannel=dev"
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags="$ldflags" -o dist/firewall-ui-linux-$arch ./cmd/firewall-ui
          done
      - uses: actions/upload-artifact@v4
        with:
          name: firewall-ui-linux
          path: dist/*
