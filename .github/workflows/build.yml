name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firewall-ui-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    outputs:
      build_time: ${{ steps.metadata.outputs.build_time }}
    steps:
      - uses: actions/checkout@v4
      - id: metadata
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: internal/webassets/dist
          retention-days: 3
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-${{ runner.os }}-tests-${{ hashFiles('go.mod') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-${{ runner.os }}-tests-${{ hashFiles('go.mod') }}-
      - name: Check shell scripts
        run: bash -n install.sh deploy/firewall-ui deploy/firewall-ui-docker scripts/build-release.sh && bash tests/installer.sh && bash tests/manager.sh && bash tests/access.sh && bash tests/uninstall.sh && bash tests/install-menu.sh && bash tests/docker-installer.sh && bash tests/docker-updates.sh && python3 tests/release-manifest.py
      - name: Check Go formatting
        run: |
          if [[ -n "$(gofmt -l ./cmd ./internal)" ]]; then
            gofmt -d ./cmd ./internal
            exit 1
          fi
      - run: go test -race -vet=off ./...
      - run: go vet ./...
  binaries:
    needs: [frontend, checks]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - uses: actions/cache@v4
        with:
          path: ~/.cache/go-build
          key: go-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('go.mod') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('go.mod') }}-
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: internal/webassets/dist
      - name: Build release binaries once
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
          BUILD_TIME: ${{ needs.frontend.outputs.build_time }}
        run: |
          set -euo pipefail
          DEV_VERSION="dev-${GITHUB_SHA::7}"
          scripts/build-release.sh "$ARCH" dev "$DEV_VERSION"
          STABLE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" != pull_request ]] && ! gh release view "v$STABLE_VERSION" >/dev/null 2>&1; then
            scripts/build-release.sh "$ARCH" stable "$STABLE_VERSION"
          fi
          printf '%s\n' "$BUILD_TIME" > dist-dev/build-time.txt
          mkdir -p release-assets
          cp -R dist-dev release-assets/
          if [[ -d dist-stable ]]; then cp -R dist-stable release-assets/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: firewall-ui-linux-${{ matrix.arch }}
          path: release-assets
          retention-days: 7

  browser:
    needs: [binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: firewall-ui-linux-amd64
          path: browser-binary
      - name: Verify browser authentication and cyberpunk layouts
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-audit --no-fund --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
          chmod +x browser-binary/dist-dev/firewall-ui-linux-amd64
          sudo -E env FIREWALL_UI_USERNAME=admin FIREWALL_UI_PASSWORD=1 browser-binary/dist-dev/firewall-ui-linux-amd64 -config "$RUNNER_TEMP/browser-config.json" -listen 127.0.0.1:18123 -state "$RUNNER_TEMP/browser-state/state.json" > "$RUNNER_TEMP/browser-server.log" 2>&1 &
          TASK_PANEL_PID=$!
          trap 'sudo kill "$TASK_PANEL_PID" || true' EXIT
          for attempt in {1..20}; do curl -fsS http://127.0.0.1:18123/ >/dev/null && break; sleep 1; done
          PLAYWRIGHT_TOOLS="$RUNNER_TEMP/browser-tools" FIREWALL_UI_SCREENSHOTS="$RUNNER_TEMP/browser-shots" node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: ${{ runner.temp }}/browser-shots
          retention-days: 3
