name: Temporary feature formatting
on:
  push:
    branches: [feature/docker-zones-diagnostics]
    paths:
      - .github/workflows/feature-format.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Format new backend and tests
        run: |
          gofmt -w internal/service/firewall_containers_forward.go internal/service/firewall_zones.go internal/service/firewall_inspect.go internal/service/firewall_traffic.go internal/service/firewall_diagnostics_test.go internal/server/firewall_diagnostics.go internal/service/firewall.go internal/service/firewall_backup.go internal/service/firewall_managed.go internal/service/firewall_safe_ops.go internal/service/firewall_autosync.go internal/server/server_ext.go
          git config user.name github-actions
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add internal/service internal/server
            git commit -m 'style: gofmt new firewall modules'
            git push origin HEAD:feature/docker-zones-diagnostics
          fi
