name: Publish releases
on:
  workflow_run:
    workflows: ['Build and test', 'Docker build']
    types: [completed]
permissions:
  contents: write
  actions: read
# Both upstream workflows trigger publication. Serialize them for the same SHA
# without cancelling either: a verified binary build publishes dev independently
# of Docker, and stable is published only after both builds have passed.
concurrency:
  group: firewall-ui-release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Find verified builds for this commit
        id: builds
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          CURRENT_HEAD="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [[ "$CURRENT_HEAD" != "$BUILD_COMMIT" ]]; then
            echo 'A newer main commit exists; skip outdated publication.'
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$BUILD_COMMIT&per_page=100" > /tmp/firewall-ui-runs.json
          BINARY_RUN="$(jq -r '[.workflow_runs[] | select(.name == "Build and test" and .conclusion == "success" and .head_branch == "main" and .event != "pull_request")] | first | .id // empty' /tmp/firewall-ui-runs.json)"
          DOCKER_RUN="$(jq -r '[.workflow_runs[] | select(.name == "Docker build" and .conclusion == "success" and .head_branch == "main" and .event != "pull_request")] | first | .id // empty' /tmp/firewall-ui-runs.json)"
          if [[ -z "$BINARY_RUN" ]]; then
            echo 'Verified binaries are not ready. The binary workflow will trigger publication when it succeeds.'
            exit 0
          fi
          echo "binary_run=$BINARY_RUN" >> "$GITHUB_OUTPUT"
          echo 'binary_ready=true' >> "$GITHUB_OUTPUT"
          if [[ -n "$DOCKER_RUN" ]]; then
            echo "docker_run=$DOCKER_RUN" >> "$GITHUB_OUTPUT"
            echo 'docker_ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Docker build has not passed; dev can publish, stable must wait.'
          fi
      - name: Download verified binaries
        if: steps.builds.outputs.binary_ready == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: firewall-ui-linux-*
          merge-multiple: true
          run-id: ${{ steps.builds.outputs.binary_run }}
          github-token: ${{ github.token }}
          path: .
      - name: Publish dev for every verified main commit
        if: steps.builds.outputs.binary_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          CURRENT_HEAD="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [[ "$CURRENT_HEAD" != "$BUILD_COMMIT" ]]; then
            echo 'Newer commit on main; dev will be published for the newer SHA.'
            exit 0
          fi
          DEV_TARGET="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/dev" --jq '.object.sha' 2>/dev/null || true)"
          if [[ "$DEV_TARGET" == "$BUILD_COMMIT" ]] && gh release view dev >/dev/null 2>&1; then
            echo 'This commit is already published in dev.'
            exit 0
          fi
          test -s dist-dev/firewall-ui-linux-amd64
          test -s dist-dev/firewall-ui-linux-arm64
          export BUILD_TIME="$(cat dist-dev/build-time.txt)"
          DEV_VERSION="dev-${BUILD_COMMIT::7}"
          python3 scripts/release-manifest.py dev "$DEV_VERSION" dev
          gh release delete dev --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create dev --target "$BUILD_COMMIT" --prerelease \
            --title 'Firewall-UI Dev' --notes "Verified build from commit $BUILD_COMMIT." \
            dist-dev/firewall-ui-linux-amd64 dist-dev/firewall-ui-linux-arm64 dist-dev/update.json
      - name: Download verified Docker images
        if: steps.builds.outputs.docker_ready == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: firewall-ui-docker-*
          merge-multiple: true
          run-id: ${{ steps.builds.outputs.docker_run }}
          github-token: ${{ github.token }}
          path: release-images
      - name: Publish stable only for a new VERSION
        id: stable
        if: steps.builds.outputs.docker_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          CURRENT_HEAD="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [[ "$CURRENT_HEAD" != "$BUILD_COMMIT" ]]; then
            echo 'Newer commit exists; skip outdated stable publication.'
            exit 0
          fi
          STABLE_VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$STABLE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'VERSION must be MAJOR.MINOR.PATCH.' >&2; exit 1; }
          TAG="v$STABLE_VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already published. Ordinary commits update dev only."
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG exists without a release; resolve the conflicting tag manually." >&2
            exit 1
          fi
          test -s dist-stable/firewall-ui-linux-amd64
          test -s dist-stable/firewall-ui-linux-arm64
          test -s release-images/firewall-ui-docker-linux-amd64.tar.gz
          test -s release-images/firewall-ui-docker-linux-arm64.tar.gz
          export BUILD_TIME="$(cat dist-dev/build-time.txt)"
          python3 scripts/release-manifest.py stable "$STABLE_VERSION" "$TAG"
          gh release create "$TAG" --target "$BUILD_COMMIT" --title "Firewall-UI $STABLE_VERSION" --generate-notes \
            dist-stable/firewall-ui-linux-amd64 dist-stable/firewall-ui-linux-arm64 dist-stable/update.json release-images/*.tar.gz
          echo 'released=true' >> "$GITHUB_OUTPUT"
      - name: Verify published stable Docker image
        if: steps.stable.outputs.released == 'true'
        run: |
          source deploy/firewall-ui-docker
          docker_download_image
          test "$(docker run --rm --entrypoint /usr/local/bin/firewall-ui firewall-ui:stable -version)" = "$(tr -d '[:space:]' < VERSION)"
