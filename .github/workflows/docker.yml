name: Docker build
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - compose*.yaml
      - deploy/docker/**
      - cmd/**
      - internal/**
      - frontend/**
      - go.mod
      - VERSION
      - tests/docker_proxy.py
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose*.yaml
      - deploy/docker/**
      - cmd/**
      - internal/**
      - frontend/**
      - go.mod
      - VERSION
      - tests/docker_proxy.py
      - .github/workflows/docker.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and build image
        env:
          FIREWALL_UI_PASSWORD: ci-compose-validation
        run: |
          docker compose config --quiet
          docker compose -f compose.proxy.yaml config --quiet
          docker compose -f compose.yaml -f compose.docker-ports.yaml config --quiet
          docker build --build-arg VCS_REF="$GITHUB_SHA" -t firewall-ui:test .
      - name: Verify startup and shutdown
        run: |
          docker run --rm firewall-ui:test -version
          docker run --rm firewall-ui:test -check-config
          trap 'docker logs firewall-ui-smoke; docker rm -f firewall-ui-smoke' EXIT
          docker run -d --name firewall-ui-smoke -e FIREWALL_UI_PASSWORD=ci-smoke -p 127.0.0.1:18088:8088 firewall-ui:test -listen 0.0.0.0:8088
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18088/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18088/ >/dev/null
          docker stop --timeout 15 firewall-ui-smoke
          test "$(docker inspect -f '{{.State.ExitCode}}' firewall-ui-smoke)" = 0
      - name: Verify proxy networking and host namespace access
        env:
          FIREWALL_UI_PASSWORD: ci-proxy-smoke
          FIREWALL_UI_PROXY_NETWORK: firewall-ui-ci-proxy
        run: |
          docker tag firewall-ui:test firewall-ui:local
          docker network create "$FIREWALL_UI_PROXY_NETWORK"
          python3 -m http.server 18889 --bind 127.0.0.1 >/tmp/firewall-ui-host-probe.log 2>&1 &
          PROBE_PID=$!
          trap 'kill "$PROBE_PID" || true; docker compose -f compose.proxy.yaml logs; docker compose -f compose.proxy.yaml down -v; docker network rm "$FIREWALL_UI_PROXY_NETWORK"' EXIT
          docker compose -f compose.proxy.yaml up -d --no-build
          for attempt in $(seq 1 30); do
            if docker run --rm --network "$FIREWALL_UI_PROXY_NETWORK" alpine:3.22 wget -qO- http://firewall-ui.internal:8088/ >/dev/null; then break; fi
            sleep 1
          done
          docker run --rm --network "$FIREWALL_UI_PROXY_NETWORK" alpine:3.22 wget -qO- http://firewall-ui.internal:8088/ >/dev/null
          docker compose -f compose.proxy.yaml exec -T firewall-ui nsenter --net=/proc/1/ns/net -- true
          docker compose -f compose.proxy.yaml exec -T firewall-ui nsenter --net=/proc/1/ns/net -- sysctl -n net.ipv4.icmp_echo_ignore_all
          docker run --rm --network "$FIREWALL_UI_PROXY_NETWORK" -v "$PWD/tests/docker_proxy.py:/check.py:ro" python:3.13-alpine python /check.py
