name: Docker build
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .dockerignore
      - deploy/docker/**
      - deploy/firewall-ui-docker
      - install.sh
      - tests/docker-installer.sh
      - cmd/**
      - internal/**
      - frontend/**
      - go.mod
      - VERSION
      - tests/docker_host.py
      - .github/workflows/docker.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and build image
        env:
          FIREWALL_UI_PASSWORD: ci-compose-validation
        run: |
          docker compose -f deploy/docker/compose.yaml config --quiet
          docker compose -f deploy/docker/compose.yaml -f deploy/docker/compose.docker-ports.yaml config --quiet
          docker build -f deploy/docker/Dockerfile --build-arg VCS_REF="$GITHUB_SHA" -t firewall-ui:test .
      - name: Export ready image
        run: |
          docker tag firewall-ui:test firewall-ui:stable
          mkdir -p release-images/stable
          docker save firewall-ui:stable | gzip -1 > release-images/stable/firewall-ui-docker-linux-${{ matrix.arch }}.tar.gz
      - name: Verify startup and shutdown
        run: |
          docker run --rm firewall-ui:test -version
          docker run --rm firewall-ui:test -check-config
          trap 'docker logs firewall-ui-smoke; docker rm -f firewall-ui-smoke' EXIT
          docker run -d --name firewall-ui-smoke -e FIREWALL_UI_PASSWORD=ci-smoke -p 127.0.0.1:18088:8088 firewall-ui:test -listen 0.0.0.0:8088
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18088/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18088/ >/dev/null
          docker stop --timeout 15 firewall-ui-smoke
          test "$(docker inspect -f '{{.State.ExitCode}}' firewall-ui-smoke)" = 0
      - name: Verify installer Docker install, update, reset and full removal
        env:
          FIREWALL_UI_NONINTERACTIVE: '1'
          FIREWALL_UI_DOCKER_AUTO_UPDATE: '0'
          FIREWALL_UI_PORT: '18089'
          FIREWALL_UI_DOCKER_DIR: /tmp/firewall-ui-installer-ci
          FIREWALL_UI_CONFIG_DIR: /tmp/firewall-ui-installer-ci-shared/config
          FIREWALL_UI_STATE_DIR: /tmp/firewall-ui-installer-ci-shared/data
          FIREWALL_UI_DOCKER_MANAGER: /tmp/firewall-ui-installer-ci-manager
          FIREWALL_UI_DOCKER_PROJECT: firewall-ui-installer-ci
          FIREWALL_UI_PASSWORD: ci-compose-smoke
        run: |
          sudo apt-get update
          sudo apt-get install -y ufw
          python3 -m http.server 18889 --bind 127.0.0.1 >/tmp/firewall-ui-host-probe.log 2>&1 &
          PROBE_PID=$!
          export FIREWALL_UI_DOCKER_IMAGE_ARCHIVE="$PWD/release-images/stable/firewall-ui-docker-linux-${{ matrix.arch }}.tar.gz"
          export FIREWALL_UI_DOCKER_IMAGE_SHA256="$(sha256sum "$FIREWALL_UI_DOCKER_IMAGE_ARCHIVE" | awk '{print $1}')"
          trap 'sudo sysctl -w net.ipv4.icmp_echo_ignore_all=0 >/dev/null; kill "$PROBE_PID" || true; sudo -E bash deploy/firewall-ui-docker uninstall || true' EXIT
          sudo -E bash install.sh --compose
          sudo test -x /usr/local/bin/fw-ui
          sudo -E /usr/local/bin/fw-ui status
          FIREWALL_UI_TEST_UPDATES=1 python3 tests/docker_host.py
          sudo test -f /etc/systemd/system/firewall-ui-docker-update.service
          sudo test -f /etc/systemd/system/firewall-ui-docker-update.timer
          sudo -E bash install.sh --compose
          sudo -E bash install.sh --compose-configure
          # An occupied port must fail and restore the previous running panel.
          if sudo -E env FIREWALL_UI_PORT=18889 bash install.sh --compose-configure; then
            echo 'Reconfiguration unexpectedly accepted an occupied port' >&2
            exit 1
          fi
          sudo grep -qx 'FIREWALL_UI_DOCKER_PORT=18089' "$FIREWALL_UI_DOCKER_DIR/docker.env"
          python3 tests/docker_host.py
          sudo -E bash install.sh --compose-reset-password
          python3 tests/docker_host.py
          sudo test -s "$FIREWALL_UI_DOCKER_DIR/source/install.sh"
          sudo test -s "$FIREWALL_UI_DOCKER_DIR/install.sh"
          sudo -E env FIREWALL_UI_USERNAME=ci-console FIREWALL_UI_PASSWORD=1 /usr/local/bin/fw-ui credentials
          FIREWALL_UI_USERNAME=ci-console FIREWALL_UI_PASSWORD=1 python3 tests/docker_host.py
          sudo -E /usr/local/bin/fw-ui restart
          FIREWALL_UI_USERNAME=ci-console FIREWALL_UI_PASSWORD=1 python3 tests/docker_host.py
          # Use the same IP/HTTPS wizard as native installation, then return to HTTP.
          sudo -E env FIREWALL_UI_ACCESS_MODE=ip FIREWALL_UI_PUBLIC_HOST=127.0.0.1 FIREWALL_UI_TLS_MODE=selfsigned bash install.sh --compose-configure
          FIREWALL_UI_USERNAME=ci-console FIREWALL_UI_PASSWORD=1 FIREWALL_UI_TEST_HTTPS=1 python3 tests/docker_host.py
          sudo -E env FIREWALL_UI_ACCESS_MODE=local bash install.sh --compose-configure
          FIREWALL_UI_USERNAME=ci-console FIREWALL_UI_PASSWORD=1 python3 tests/docker_host.py
          docker run --rm --network host --privileged --mount type=bind,src="$FIREWALL_UI_STATE_DIR",dst=/var/lib/firewall-ui --entrypoint sh firewall-ui:stable -c '
            printf "{\"firewallPingEnabled\":\"false\"}" > /var/lib/firewall-ui/state.json
            printf "1\n" > /proc/sys/net/ipv4/icmp_echo_ignore_all
            if [ -f /proc/sys/net/ipv6/icmp/echo_ignore_all ]; then printf "1\n" > /proc/sys/net/ipv6/icmp/echo_ignore_all; fi
          '
          docker volume create --label com.docker.compose.project=firewall-ui-installer-ci --label com.docker.compose.volume=unrelated ci-unrelated-volume
          # Offline removal must use the already installed capable cleanup image.
          sudo -E env FIREWALL_UI_DOCKER_IMAGE_ARCHIVE=/nonexistent/archive /usr/local/bin/fw-ui uninstall --purge
          docker volume inspect ci-unrelated-volume >/dev/null
          sudo -E bash -c 'source install.sh; installer_detect_installations; test "$COMPOSE_INSTALLED" = 0'
          docker volume rm ci-unrelated-volume
          test "$(sysctl -n net.ipv4.icmp_echo_ignore_all)" = 0
          if [ -f /proc/sys/net/ipv6/icmp/echo_ignore_all ]; then test "$(sysctl -n net.ipv6.icmp.echo_ignore_all)" = 0; fi
          test ! -e /etc/systemd/system/firewall-ui-docker-update.service
          test ! -e /etc/systemd/system/firewall-ui-docker-update.timer
          test ! -e "$FIREWALL_UI_DOCKER_DIR"
          test ! -e "$FIREWALL_UI_CONFIG_DIR"
          test ! -e "$FIREWALL_UI_STATE_DIR"
          test ! -e "$FIREWALL_UI_DOCKER_MANAGER"
          test ! -e /usr/local/bin/fw-ui
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=firewall-ui-installer-ci)"
          test -z "$(docker volume ls -q --filter label=com.docker.compose.project=firewall-ui-installer-ci)"
      - name: Build ready dev image for this commit
        run: |
          docker build -f deploy/docker/Dockerfile --build-arg VCS_REF="$GITHUB_SHA" --build-arg BUILD_CHANNEL=dev -t firewall-ui:dev .
          test "$(docker run --rm --entrypoint /usr/local/bin/firewall-ui firewall-ui:dev -version)" = "dev-${GITHUB_SHA::7}"
          docker tag firewall-ui:dev firewall-ui:stable
          mkdir -p release-images/dev
          docker save firewall-ui:stable | gzip -1 > release-images/dev/firewall-ui-docker-linux-${{ matrix.arch }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: firewall-ui-docker-${{ matrix.arch }}
          path: release-images/**/*
          retention-days: 3
