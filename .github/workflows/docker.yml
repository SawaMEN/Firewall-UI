name: Docker build
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - compose*.yaml
      - deploy/docker/**
      - deploy/firewall-ui-docker
      - install.sh
      - tests/docker-installer.sh
      - cmd/**
      - internal/**
      - frontend/**
      - go.mod
      - VERSION
      - tests/docker_host.py
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - compose*.yaml
      - deploy/docker/**
      - deploy/firewall-ui-docker
      - install.sh
      - tests/docker-installer.sh
      - cmd/**
      - internal/**
      - frontend/**
      - go.mod
      - VERSION
      - tests/docker_host.py
      - .github/workflows/docker.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose and build image
        env:
          FIREWALL_UI_PASSWORD: ci-compose-validation
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.docker-ports.yaml config --quiet
          docker build --build-arg VCS_REF="$GITHUB_SHA" -t firewall-ui:test .
      - name: Export ready image
        run: |
          docker tag firewall-ui:test firewall-ui:stable
          mkdir -p release-images
          docker save firewall-ui:stable | gzip -1 > release-images/firewall-ui-docker-linux-${{ matrix.arch }}.tar.gz
      - name: Verify startup and shutdown
        run: |
          docker run --rm firewall-ui:test -version
          docker run --rm firewall-ui:test -check-config
          trap 'docker logs firewall-ui-smoke; docker rm -f firewall-ui-smoke' EXIT
          docker run -d --name firewall-ui-smoke -e FIREWALL_UI_PASSWORD=ci-smoke -p 127.0.0.1:18088:8088 firewall-ui:test -listen 0.0.0.0:8088
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18088/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18088/ >/dev/null
          docker stop --timeout 15 firewall-ui-smoke
          test "$(docker inspect -f '{{.State.ExitCode}}' firewall-ui-smoke)" = 0
      - name: Verify installer Docker install, update, reset and full removal
        env:
          FIREWALL_UI_NONINTERACTIVE: '1'
          FIREWALL_UI_PORT: '18089'
          FIREWALL_UI_DOCKER_DIR: /tmp/firewall-ui-installer-ci
          FIREWALL_UI_DOCKER_MANAGER: /tmp/firewall-ui-installer-ci-manager
          FIREWALL_UI_DOCKER_PROJECT: firewall-ui-installer-ci
          FIREWALL_UI_PASSWORD: ci-compose-smoke
        run: |
          python3 -m http.server 18889 --bind 127.0.0.1 >/tmp/firewall-ui-host-probe.log 2>&1 &
          PROBE_PID=$!
          export FIREWALL_UI_DOCKER_IMAGE_ARCHIVE="$PWD/release-images/firewall-ui-docker-linux-${{ matrix.arch }}.tar.gz"
          export FIREWALL_UI_DOCKER_IMAGE_SHA256="$(sha256sum "$FIREWALL_UI_DOCKER_IMAGE_ARCHIVE" | awk '{print $1}')"
          trap 'sudo sysctl -w net.ipv4.icmp_echo_ignore_all=0 >/dev/null; kill "$PROBE_PID" || true; sudo -E bash deploy/firewall-ui-docker uninstall || true' EXIT
          sudo -E bash install.sh --compose
          python3 tests/docker_host.py
          sudo -E bash install.sh --compose
          sudo -E bash install.sh --compose-configure
          # An occupied port must fail and restore the previous running panel.
          if sudo -E env FIREWALL_UI_PORT=18889 bash install.sh --compose-configure; then
            echo 'Reconfiguration unexpectedly accepted an occupied port' >&2
            exit 1
          fi
          sudo grep -qx 'FIREWALL_UI_DOCKER_PORT=18089' "$FIREWALL_UI_DOCKER_DIR/docker.env"
          python3 tests/docker_host.py
          sudo -E bash install.sh --compose-reset-password
          python3 tests/docker_host.py
          docker run --rm --network host --privileged --mount type=volume,src=firewall-ui-installer-ci_firewall-ui-data,dst=/var/lib/firewall-ui --entrypoint sh firewall-ui:stable -c '
            printf "{\"firewallPingEnabled\":\"false\"}" > /var/lib/firewall-ui/state.json
            printf "1\n" > /proc/sys/net/ipv4/icmp_echo_ignore_all
            if [ -f /proc/sys/net/ipv6/icmp/echo_ignore_all ]; then printf "1\n" > /proc/sys/net/ipv6/icmp/echo_ignore_all; fi
          '
          sudo -E bash install.sh --uninstall
          test "$(sysctl -n net.ipv4.icmp_echo_ignore_all)" = 0
          if [ -f /proc/sys/net/ipv6/icmp/echo_ignore_all ]; then test "$(sysctl -n net.ipv6.icmp.echo_ignore_all)" = 0; fi
          test ! -e "$FIREWALL_UI_DOCKER_DIR"
          test ! -e "$FIREWALL_UI_DOCKER_MANAGER"
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=firewall-ui-installer-ci)"
          test -z "$(docker volume ls -q --filter label=com.docker.compose.project=firewall-ui-installer-ci)"
      - uses: actions/upload-artifact@v4
        with:
          name: firewall-ui-docker-${{ matrix.arch }}
          path: release-images/*
          retention-days: 3
